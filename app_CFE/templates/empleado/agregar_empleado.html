{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-success text-center mb-4">Agregar Nuevo Empleado</h2>
    <form method="POST" class="border p-4 rounded shadow">
        {% csrf_token %}
        <div class="row mb-3">
            <div class="col">
                <label>Nombre:</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="col">
                <label>Apellido:</label>
                <input type="text" name="apellido" class="form-control" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label>Puesto:</label>
                <input type="text" name="puesto" class="form-control" required>
            </div>
            <div class="col">
                <label>RFC:</label>
                <input type="text" name="rfc" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label>Email:</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label>Fecha de Contratación:</label>
                <input type="date" name="fecha_contratacion" class="form-control" required>
            </div>
            <div class="col">
                <label>Salario:</label>
                <input type="number" name="salario" step="0.01" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label>Sucursal:</label>
            <select name="sucursal" class="form-select" required>
                <option value="">Seleccione una sucursal</option>
                {% for s in sucursales %}
                <option value="{{ s.id }}">{{ s.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'ver_empleados' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
